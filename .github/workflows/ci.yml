name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter test
      # The catalogue smoke test lives with the example it renders.
      - run: flutter pub get
        working-directory: example
      - run: flutter test
        working-directory: example
      # After both pub gets: the style follows each package's language version.
      - run: dart format --output=none --set-exit-if-changed lib test tool example/lib example/test

  check_web_tokens:
    name: Web token drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart tool/export_tokens.dart
      - run: git diff --exit-code web/quarto/

  check_contract:
    name: Architecture contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      # Import direction, acyclicity, sealed raw tokens. See ARCHITECTURE.md.
      - run: dart tool/check_layering.dart
      # Public-surface naming + example coverage, ratcheted against
      # tool/public_api_baseline.txt.
      - run: dart tool/check_public_api.dart
      # Ink and paper only, every font size on the WabType ladder.
      - run: dart tool/check_house_rules.dart

  build_apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk
        working-directory: example

  build_web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
        working-directory: example
      - run: flutter build web
        working-directory: example

  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: sudo apt-get update --yes && sudo apt-get install --yes cmake ninja-build clang pkg-config libgtk-3-dev libblkid-dev liblzma-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
        working-directory: example
      - run: flutter build linux
        working-directory: example
