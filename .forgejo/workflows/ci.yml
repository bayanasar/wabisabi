# Forgejo runs this file. Once a .forgejo/workflows directory exists it ignores
# .github/workflows, which stays for the public mirror. The runner label maps
# to a Debian container that runs as root and ships without Flutter, a JDK or
# the Android SDK, so the job installs them and caches what it downloads. One
# job runs the whole gate, so the SDKs are set up once.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2
  FLUTTER_HOME: /opt/flutter
  ANDROID_HOME: /opt/android-sdk

jobs:
  gate:
    name: analyze, test, contracts, build web/linux/android
    runs-on: linux-docker
    steps:
      - uses: actions/checkout@v4

      - name: Linux desktop and Android toolchains
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev \
            openjdk-17-jdk-headless

      - uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_HOME }}
          key: flutter-${{ env.FLUTTER_VERSION }}-linux-web-android

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ env.FLUTTER_VERSION }}-${{ hashFiles('example/android/**/*.gradle*', 'example/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Flutter ${{ env.FLUTTER_VERSION }} and the Android SDK
        run: |
          # Restored caches are git checkouts owned by another uid.
          git config --global --add safe.directory '*'
          if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
            git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" \
              https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          "$sdkmanager" --licenses < <(yes) > /dev/null
          "$sdkmanager" --install platform-tools > /dev/null
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          "$FLUTTER_HOME/bin/flutter" config --no-analytics --enable-linux-desktop \
            --android-sdk "$ANDROID_HOME"
          "$FLUTTER_HOME/bin/flutter" --version

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The catalogue smoke test lives with the example it renders.
      - run: flutter pub get
        working-directory: example
      - run: flutter test
        working-directory: example

      - name: Web token drift
        run: |
          dart tool/export_tokens.dart
          git diff --exit-code web/quarto/

      # Import direction, acyclicity, sealed raw tokens; public-surface naming;
      # ink and paper only. See ARCHITECTURE.md.
      - run: dart tool/check_layering.dart
      - run: dart tool/check_public_api.dart
      - run: dart tool/check_house_rules.dart

      - run: flutter build web
        working-directory: example
      - run: flutter build linux
        working-directory: example
      - run: flutter build apk
        working-directory: example
