name: wabisabi
description: >-
  侘寂 — a Flutter widget kit with an East Asian document grammar: procedural
  paper, wood, cloth and cinnabar surfaces, no image assets, no dependencies.
version: 0.2.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # Bundled fonts — full charsets, no system-font dependency for consumers.
  # All SIL OFL 1.1; licenses in assets/fonts/OFL-*.txt.
  # Regenerate with tool/build_fonts.sh. Referenced as
  # 'packages/wabisabi/WabKai' etc. (see the fallback chains in wab_theme.dart).
  fonts:
    # 正楷帶行意 — LXGW WenKai TC (霞鶩文楷 TC), 繁簡全覆蓋 25k+ 字.
    # Medium (500) stands in for bold; heavier FontWeights resolve to it.
    - family: WabKai
      fonts:
        - asset: assets/fonts/WabKai-Regular.ttf
          weight: 400
        - asset: assets/fonts/WabKai-Medium.ttf
          weight: 500
    # Monospace face (JetBrains Mono, static instances) — code, latin labels.
    - family: WabMono
      fonts:
        - asset: assets/fonts/WabMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/WabMono-Medium.ttf
          weight: 500
